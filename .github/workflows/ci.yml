name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, edited ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JDK 17 + MySQL)
    runs-on: ubuntu-latest
    services:
      # 与 deploy/mysql/docker-compose.yml 同构：宿主侧 13306（jdbc 单测硬编码端口）
      mysql:
        image: mysql:8.0
        ports:
          - 13306:3306
        env:
          MYSQL_ROOT_PASSWORD: minispring_root
          MYSQL_DATABASE: minispring_demo
          MYSQL_USER: minispring
          MYSQL_PASSWORD: minispring_123
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uminispring -pminispring_123"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify repository contracts
        run: python3 scripts/verify_repository_contracts.py

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Init schema (deploy/mysql/init.sql)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
          for i in $(seq 1 30); do
            mysql -h 127.0.0.1 -P 13306 -u minispring -pminispring_123 -e "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          mysql -h 127.0.0.1 -P 13306 -u minispring -pminispring_123 minispring_demo < deploy/mysql/init.sql

      - name: Build and test (mvn clean install)
        run: mvn clean install -B

  frontend:
    name: Frontend (Node 22 + Vite build and audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo-frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org
