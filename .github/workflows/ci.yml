name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (JDK 17 + MySQL)
    runs-on: ubuntu-latest
    services:
      # 与 deploy/mysql/docker-compose.yml 同构：宿主侧 13306（jdbc 单测硬编码端口）
      mysql:
        image: mysql:8.0
        ports:
          - 13306:3306
        env:
          MYSQL_ROOT_PASSWORD: minispring_root
          MYSQL_DATABASE: minispring_demo
          MYSQL_USER: minispring
          MYSQL_PASSWORD: minispring_123
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uminispring -pminispring_123"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Init schema (deploy/mysql/init.sql)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
          for i in $(seq 1 30); do
            mysql -h 127.0.0.1 -P 13306 -u minispring -pminispring_123 -e "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          mysql -h 127.0.0.1 -P 13306 -u minispring -pminispring_123 minispring_demo < deploy/mysql/init.sql

      - name: Build and test (mvn clean install)
        run: mvn clean install -B

  frontend:
    name: Frontend (Node 20 + Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: demo-frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build
