name: Bounded improvement proposal
description: Propose a scoped teaching, reliability, test, documentation, or maintenance improvement.
title: "proposal: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the concrete learning, correctness, reliability, or maintenance gap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: State the smallest useful change and the affected modules.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and trade-offs
      description: Explain what remains unsupported and whether core dependency direction or public claims change.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: List positive, negative, regression, and documentation checks.
    validations:
      required: true
  - type: checkboxes
    id: honesty
    attributes:
      label: Scope confirmation
      options:
        - label: I am not presenting a proposal as already implemented or validated.
          required: true
        - label: The proposal preserves the distinction between framework core and demo/deployment dependencies.
          required: true
