services:
  mysql:
    image: mysql:8.0
    container_name: minispring-mysql
    # 决策点 C 预案：宿主 3306 被本机 mysqld 占用，容器映射 13306（demo 连接串 jdbc:mysql://localhost:13306/...）
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: minispring_root
      MYSQL_DATABASE: minispring_demo
      MYSQL_USER: minispring
      MYSQL_PASSWORD: minispring_123
    # M0 内存预算：MySQL 容器 512MB
    mem_limit: 512m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uminispring", "-pminispring_123"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
