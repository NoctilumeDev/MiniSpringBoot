services:
  nginx:
    image: nginx:1.28-alpine
    container_name: minispring-nginx
    restart: unless-stopped
    ports:
      - "9080:80"
    mem_limit: 64m
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../demo-frontend/dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
