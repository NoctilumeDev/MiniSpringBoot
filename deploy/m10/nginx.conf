worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 30;

    log_format m10 '$time_iso8601 $remote_addr "$request" $status '
                   'upstream=$upstream_addr upstream_status=$upstream_status '
                   'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /var/log/nginx/access.log m10;

    # 通过 Docker 内置 DNS 动态取宿主网关，但明确禁用容器当前不可达的 IPv6。
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 2s;

    upstream mini_spring_backend {
        zone mini_spring_backend 64k;
        least_conn;
        # 由上方 Docker DNS resolver 动态解析，并过滤当前容器不可达的 IPv6；
        # 否则一次三重重试可能全落到坏地址而产生偶发 502。
        server host.docker.internal:9091 resolve max_fails=1 fail_timeout=3s;
        server host.docker.internal:9092 resolve max_fails=1 fail_timeout=3s;
        server host.docker.internal:9093 resolve max_fails=1 fail_timeout=3s;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 35s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # 实际命中的上游地址随响应返回，供容量报告统计三实例分布。
        add_header X-MiniSpring-Upstream $upstream_addr always;

        location = /health/live {
            proxy_pass http://mini_spring_backend/health/live;
        }

        location = /health {
            proxy_pass http://mini_spring_backend/health;
        }

        location /api/ {
            proxy_pass http://mini_spring_backend/;
            # 故意不启用 non_idempotent：POST/PUT/DELETE 连接失败时不能盲目重放。
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
