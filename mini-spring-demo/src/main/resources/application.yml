# MiniSpringBoot 后端 demo 默认配置（M4 外部化配置字段 + M6 自动配置开关 + M7 应用字段合并）
app:
  name: "MiniSpringBoot"
  owner: "yml-value"
  timeout: 30
  features:
    - ioc
    - aop
  pointer: name
server:
  # 默认只监听本机；确需局域网访问时才显式改为 0.0.0.0，并自行配置外围访问控制。
  address: "127.0.0.1"
  port: "9090"
  worker-threads: 8
  queue-capacity: 128
smtp:
  host: localhost
  port: 25
# M6 自动配置演示：optionalFeature 开关
feature:
  optional:
    enabled: "true"
# M8 数据源（决策点 A：minispring.datasource.* 前缀；容器 deploy/mysql，宿主 13306）
minispring:
  datasource:
    url: "jdbc:mysql://localhost:13306/minispring_demo?useSSL=false&allowPublicKeyRetrieval=true"
    username: "minispring"
    password: "minispring_123"
    max-pool-size: 10
